<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Information - Diabetes Risk Assessment</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="{{ url_for('home') }}">
            Diabetes Risk Assessment
        </a>

        <nav class="top-nav">
            <a class="active" href="{{ url_for('home') }}">
                Risk Assessment
            </a>
             <a href="{{ url_for('dashboard') }}">Data Dashboard</a>
            <a href="{{ url_for('about') }}">About</a>
        </nav>
    </div>
</header>

<main class="page-shell">

<section class="assessment-card">

<!-- STEP 2 -->
<section class="form-step active" data-step="2">

    <div class="progress-wrap">
    <div class="progress-track">
        <div class="progress-fill" style="width: 50%;"></div>
    </div>

    <div class="step-indicators">

        <div class="step-indicator completed">
            <span>1</span>
            <small>About You</small>
        </div>

        <div class="step-indicator active">
            <span>2</span>
            <small>Health</small>
        </div>

        <div class="step-indicator">
            <span>3</span>
            <small>Lifestyle</small>
        </div>

        <div class="step-indicator">
            <span>4</span>
            <small>Review</small>
        </div>

    </div>
</div>

    <div class="step-heading">
        <span class="step-kicker">Step 2 of 4</span>
        <h2>Health Information</h2>
        <p>Please provide some basic information about your health.</p>
    </div>
    <form method="POST">

<div class="form-grid">

    <!-- BMI -->
    <div class="field-group">
        <label for="BMI">BMI</label>

        <input
            id="BMI"
            type="number"
            step="0.1"
            min="10"
            max="80"
            name="BMI"
            placeholder="Example: 24.6"
            required
        >

        <small>Enter your Body Mass Index (BMI).</small>
    </div>


    <!-- High Blood Pressure -->
    <fieldset class="field-group">
        <legend>High Blood Pressure</legend>

        <div class="choice-row">

            <label class="choice-card">
                <input
                    type="radio"
                    name="HighBP"
                    value="High Blood Pressure"
                    data-display="Yes"
                    required
                >
                <span>Yes</span>
            </label>

            <label class="choice-card">
                <input
                    type="radio"
                    name="HighBP"
                    value="No High Blood Pressure"
                    data-display="No"
                >
                <span>No</span>
            </label>

        </div>
    </fieldset>


    <!-- High Cholesterol -->
    <fieldset class="field-group">
        <legend>High Cholesterol</legend>

        <div class="choice-row">

            <label class="choice-card">
                <input
                    type="radio"
                    name="HighChol"
                    value="High Cholesterol"
                    data-display="Yes"
                    required
                >
                <span>Yes</span>
            </label>

            <label class="choice-card">
                <input
                    type="radio"
                    name="HighChol"
                    value="No High Cholesterol"
                    data-display="No"
                >
                <span>No</span>
            </label>

        </div>
    </fieldset>


    <!-- General Health -->
    <div class="field-group">
        <label for="General_Health">General Health</label>

        <select
            id="General_Health"
            name="General_Health"
            required
        >
            <option value="" selected disabled>
                Select general health
            </option>

            <option value="Excellent">Excellent</option>
            <option value="Very Good">Very Good</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
            <option value="Poor">Poor</option>

        </select>
    </div>

</div>


    <div class="form-actions">

        <a href="{{ url_for('home') }}"
           class="btn btn-secondary">
            Back
        </a>

        <button type="submit"
                class="btn btn-primary">
            Continue
        </button>

    </div>

</form>

</section>

</section>

</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
